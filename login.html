<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login – BusKu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <script src="script.js"></script>
</head>
<body class="login-page">

<main class="login-wrap">
  <div class="login-brand">
    <span class="nav-brand-icon">🚌</span>
    <span class="nav-brand-text"><span class="nav-brand-accent">Bus</span>Ku</span>
  </div>
  <p class="login-tagline">Masuk dulu untuk mulai memesan tiket bus</p>

  <div class="form-wrapper login-card">
    <div class="login-tabs">
      <button type="button" id="tabLogin" class="login-tab active" onclick="gantiTab('login')">Masuk</button>
      <button type="button" id="tabRegister" class="login-tab" onclick="gantiTab('register')">Daftar</button>
    </div>

    <!-- FORM LOGIN -->
    <div id="formLogin">
      <div id="alertLogin"></div>
      <div class="form-group">
        <label>Email <span class="req">*</span></label>
        <input type="email" class="form-control" id="loginEmail" placeholder="email@contoh.com" autocomplete="username"/>
        <div class="error-msg" id="err-lEmail">Email tidak valid.</div>
      </div>
      <div class="form-group">
        <label>Password <span class="req">*</span></label>
        <div class="pass-wrap">
          <input type="password" class="form-control" id="loginPass" placeholder="Masukkan password" autocomplete="current-password"/>
          <span class="pass-toggle" onclick="togglePassword('loginPass', this)">👁️</span>
        </div>
        <div class="error-msg" id="err-lPass">Password harus diisi.</div>
      </div>
      <button type="button" class="btn btn-primary btn-block" onclick="prosesLogin()">Masuk</button>
      <p class="login-switch">Belum punya akun? <a href="#" onclick="gantiTab('register'); return false;">Daftar sekarang</a></p>
    </div>

    <!-- FORM REGISTER -->
    <div id="formRegister" style="display:none;">
      <div id="alertRegister"></div>
      <div class="form-group">
        <label>Nama Lengkap <span class="req">*</span></label>
        <input type="text" class="form-control" id="regNama" placeholder="Nama Anda" autocomplete="name"/>
        <div class="error-msg" id="err-rNama">Nama harus diisi.</div>
      </div>
      <div class="form-group">
        <label>Email <span class="req">*</span></label>
        <input type="email" class="form-control" id="regEmail" placeholder="email@contoh.com" autocomplete="email"/>
        <div class="error-msg" id="err-rEmail">Email tidak valid.</div>
      </div>
      <div class="form-group">
        <label>Password <span class="req">*</span></label>
        <div class="pass-wrap">
          <input type="password" class="form-control" id="regPass" placeholder="Minimal 6 karakter" autocomplete="new-password"/>
          <span class="pass-toggle" onclick="togglePassword('regPass', this)">👁️</span>
        </div>
        <div class="error-msg" id="err-rPass">Password minimal 6 karakter.</div>
      </div>
      <div class="form-group">
        <label>Konfirmasi Password <span class="req">*</span></label>
        <input type="password" class="form-control" id="regPass2" placeholder="Ulangi password" autocomplete="new-password"/>
        <div class="error-msg" id="err-rPass2">Konfirmasi password tidak sama.</div>
      </div>
      <button type="button" class="btn btn-primary btn-block" onclick="prosesRegister()">Buat Akun</button>
      <p class="login-switch">Sudah punya akun? <a href="#" onclick="gantiTab('login'); return false;">Masuk</a></p>
    </div>
  </div>
</main>

</body>
</html>
